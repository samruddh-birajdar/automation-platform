services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: automation_user
      POSTGRES_PASSWORD: automation_password
      POSTGRES_DB: automation_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automation_user -d automation_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./Automation-Backend
    ports:
      - "8000:8000"
    env_file:
      - ./Automation-Backend/.env.docker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  worker:
    build: ./Automation-Backend
    env_file:
      - ./Automation-Backend/.env.docker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: